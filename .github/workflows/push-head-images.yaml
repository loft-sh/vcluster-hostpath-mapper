name: Push head images

# The daily CVE scan reads ghcr.io/loft-sh/vcluster-hpm:head, so it follows main.
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
      - "cmd/**"
      - ".github/workflows/push-head-images.yaml"
  workflow_dispatch:

concurrency:
  group: push-head-images
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.repository_owner == 'loft-sh'

    name: Publish vcluster-hpm head image

    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write       # Required to push to GHCR
      id-token: write       # Required for Cosign keyless OIDC signing and provenance
      attestations: write   # Required to publish build provenance attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: "v3.0.6"

      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the current head image
        id: previous-head
        uses: loft-sh/github-actions/.github/actions/delete-previous-head-image@delete-previous-head-image/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh action, pinned by its own rolling tag by policy
        with:
          mode: record
          image: ghcr.io/${{ github.repository_owner }}/vcluster-hpm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push head image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build-push-docker
        with:
          # The scan reads linux/amd64 only; releases are multi-arch.
          platforms: linux/amd64
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vcluster-hpm:head

      - name: Sign head image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/vcluster-hpm:head
          IMAGE_DIGEST: ${{ steps.build-push-docker.outputs.digest }}
        run: cosign sign --yes "${IMAGE_TAG}@${IMAGE_DIGEST}"

      - name: Attest head image build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/vcluster-hpm
          subject-digest: ${{ steps.build-push-docker.outputs.digest }}
          push-to-registry: true

      # Last step, so a failed build or push never deletes the image it replaces.
      - name: Delete the previous head image
        uses: loft-sh/github-actions/.github/actions/delete-previous-head-image@delete-previous-head-image/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh action, pinned by its own rolling tag by policy
        with:
          mode: delete
          image: ghcr.io/${{ github.repository_owner }}/vcluster-hpm
          previous-digest: ${{ steps.previous-head.outputs.digest }}
          current-digest: ${{ steps.build-push-docker.outputs.digest }}
